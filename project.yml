name: AppPushTestMac
options:
  bundleIdPrefix: com.carplus.apppushtestmac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
    ENABLE_HARDENED_RUNTIME: YES

targets:
  AppPushTestMac:
    type: application
    platform: macOS
    sources:
      - path: AppPushTestMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carplus.apppushtestmac
        PRODUCT_NAME: AppPushTestMac
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: AppPushTestMac/AppPushTestMac.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
    entitlements:
      path: AppPushTestMac/AppPushTestMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
